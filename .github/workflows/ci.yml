name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ["1.25","1.26"]
        # TODO: Add go-version "1.25" to the matrix for multi-version testing
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage is below threshold: $COVERAGE%"
            exit 1
          else
            echo "Coverage is above threshold: $COVERAGE%"
          fi
          echo "Coverage check passed with $COVERAGE%"

      - name: Generate coverage HTML
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.go-version }}-${{ matrix.os }}
          path: coverage.out

      - name: Build
        run: go build -o api-server ./cmd/api

  # TODO: Add lint job using golangci-lint
  # Hint: Use the golangci/golangci-lint-action@v4 action
  lint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.0.0

        - name: Set up Go 1.24
          uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
          with:
            go-version: 1.24

        - name: Download dependencies
          run: go mod download

        - name: Lint job
          uses: golangci/golangci-lint-action@d6238b002a20823d52840fda27e2d4891c5952dc # v4.0.1
          with:
            args: --config .golangci.yml

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: product-catalog:${{ github.sha }}

  # TODO: Add sonarcloud job
  # Hint: Use the SonarSource/sonarqube-scan-action or sonarcloud-github-action
  # You will need to configure sonar-project.properties

  sonarcloud:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: all-coverage/coverage-1.26-ubuntu-latest/coverage.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        with:
            args: >
              -Dsonar.go.coverage.reportPaths=all-coverage/coverage-1.26-ubuntu-latest/coverage.out
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}